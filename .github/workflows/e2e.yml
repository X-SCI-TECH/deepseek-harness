name: E2E (real DeepSeek API)

# Real-API end-to-end suite (`pnpm run test:e2e`). Consumes the
# DEEPSEEK_API_KEY_EXTERNAL secret (mapped to the env var DEEPSEEK_API_KEY the
# tests read) and hits the external API at https://api.deepseek.com
# (DEEPSEEK_BASE_URL is pinned to it explicitly so a stray repo-root .env
# can't redirect the run).
#
# Triggered on push to main/master. The PR / schedule / manual triggers are
# commented out (kept for later re-enable, see `on:` below) — this E2E run
# burns real API tokens on every invocation, so re-enable them consciously.
#
# SECURITY: this workflow only ever runs in the receiving repo's context with
# the secret available. NEVER add `pull_request_target` (or any secret-bearing
# PR trigger) — it would let an untrusted fork exfiltrate the key.
on:
  push:
    branches: [main, master]
  # Disabled triggers — commented out rather than deleted, so they can be
  # re-enabled by uncommenting. Remember: each one burns real API tokens.
  # workflow_dispatch:
  # pull_request:
  # schedule:
  #   # 00:17 UTC nightly = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
  #   - cron: '17 0 * * *'

# Cancel a superseded PR run (it is on a stale commit); never cancel a
# push run. Commented out together with the PR trigger above — uncomment
# alongside it if PR runs are ever re-enabled.
# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e
    # Guard for untrusted PRs (forks + Dependabot), where the secret is
    # withheld — they would otherwise hard-fail the preflight. Commented out
    # together with the pull_request trigger in `on:`.
    # if: >-
    #   github.event_name != 'pull_request'
    #   || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')
    # Profile e2e files can each own several complete dsh subprocess trees, so
    # four file workers preserve process/PTY headroom. Tests retain 120s/test
    # and retry 2; 45m still bounds retry storms against a slow API.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Prepare
      # bwrap so trusted CI exercises it; the functional probe remains the
      # authority on whether the runner can use the sandbox.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Guard against a false green: the e2e suites self-skip when the key is
      # absent, so a missing/misconfigured secret would otherwise pass as
      # "all skipped". This job only runs on push to main/master, so the
      # secret MUST be present — fail loudly if not.
      - name: Preflight (require DEEPSEEK_API_KEY)
        env:
          # Repo secret DEEPSEEK_API_KEY_EXTERNAL holds the external-API key;
          # the tests read process.env.DEEPSEEK_API_KEY, so map it across here.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY is empty. The e2e suite would self-skip and"
            echo "::error::report a false green. Configure the repo secret DEEPSEEK_API_KEY_EXTERNAL."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY present."

      # The e2e suites boot the example bins in `lib` mode (DSH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        run: pnpm run build:official

      # Real-API end-to-end tests only. The keyless gates (lint/typecheck/
      # coverage/snapshot/etc.) already run in ci.yml (pull requests) and
      # ci-master.yml (master push standby).
      # DEEPSEEK_BASE_URL is pinned to the external API; the secret is scoped to
      # this step (and preflight) only — never exposed to checkout/setup/install.
      - name: E2E tests (real DeepSeek API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DSH_E2E_MAX_WORKERS: 4
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
